<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 실습 3</title>
</head>
<body>
    <h1>이미지 속성 변경</h1>
    <img src="" alt="이미지가 여기에 표시됩니다." id="image">
    <br>
    <br>
    <button id="imageButton">이미지 보이기</button>

    <script>
        let image = document.getElementById('image');
        let button = document.getElementById('imageButton');
        button.onclick = function(){
            image.src="https://placehold.co/300x200";
            image.width=300;
            image.height=200;
        }
    </script>
</body>
</html>
