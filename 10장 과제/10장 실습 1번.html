<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM 실습 1</title>
    <script>

    </script>
</head>
<body>
    <h1 id="title">처음 제목입니다.</h1>
    <button id="changeButton">제목 바꾸기</button>

    <script>
        let title = document.getElementById('title');
        let button = document.getElementById('changeButton');

        button.onclick = function(){
            title.textContent = "JavaScript로 제목을 바꿨습니다."
        }
    </script>
    
</body>
</html>
